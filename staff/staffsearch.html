<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Search - Ration Shop Management</title>
    <!-- Shared Stylesheet -->
    <link rel="stylesheet" href="../style.css">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Layout Script -->
    <script src="../applayout.js" defer></script>
</head>
<body>

    <staff-app-layout no-header>
        <!-- Page Header with Back Arrow -->
        <div class="page-header" style="display: flex; align-items: center; gap: 15px; margin-bottom: 15px;">
            <i class="fa-solid fa-arrow-left" style="font-size: 20px; color: #5a4538; cursor: pointer;"></i>
            <h2 style="font-size: 24px; color: #5a4538; margin: 0;">Search</h2>
        </div>

        <!-- Search Bar -->
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass" style="color: #8c7866;"></i>
            <input type="text" placeholder="Search for a Ration Card">
        </div>

        <!-- Search Result Cards Container -->
        <div class="search-results">
            
            <!-- Result Card 1 -->
            <div class="result-card">
                <div class="result-avatar">
                    <i class="fa-solid fa-user" style="color: #b59f8c; font-size: 28px;"></i>
                </div>
                <div class="result-details">
                    <h4>Ration Card No:112345</h4>
                    <p>Family Members : 4</p>
                    <p>Card Type : NPHH</p>
                </div>
            </div>

            <!-- Result Card 2 -->
            <div class="result-card">
                <div class="result-avatar">
                    <i class="fa-solid fa-user" style="color: #b59f8c; font-size: 28px;"></i>
                </div>
                <div class="result-details">
                    <h4>Ration Card No:234556</h4>
                    <p>Family Members : 4</p>
                    <p>Card Type : AAY</p>
                </div>
            </div>

            <!-- Result Card 3 -->
            <div class="result-card">
                <div class="result-avatar">
                    <i class="fa-solid fa-user" style="color: #b59f8c; font-size: 28px;"></i>
                </div>
                <div class="result-details">
                    <h4>Ration Card No:145678</h4>
                    <p>Family Members : 3</p>
                    <p>Card Type : NPHH</p>
                </div>
            </div>

        </div>
    </staff-app-layout >

</body>
</html>
