<!DOCTYPE html>
<html lang="en">
<head>
    <title>User Login</title>
    <link rel="stylesheet" href="../style.css">
    <script src="../layout.js" defer></script>
    <script type="module" src="userClient.js"></script>
</head>
<body>

    <login-layout>
        <a href="index.html">← Back to Login</a>

        <h3>User Login</h3>
        <p>Access your user account</p>

        <form>
            <div class="ration_Id">
                <input
                    type="text"
                    id="ration_id"
                    name="ration_id"
                    placeholder="Ration ID"
                    required
                >
            </div>

            <div class="password">
                <input
                    type="password"
                    id="user_password"
                    name="user_password"
                    placeholder="Enter Password"
                    required
                >
            </div>

            <button type="submit">Login</button>
        </form>
    </login-layout>

</body>
</html>
