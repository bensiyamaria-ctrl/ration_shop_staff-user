<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Home</title>
    <link rel="stylesheet" href="../user-style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="../user-applayout.js" defer></script>
</head>
<body>

    <user-app-layout>

            <!--Update 1-->
            <div class="update-card tan-card">
                <div class="update-icon tan-icon">
                    <i class="fa-solid fa-bullhorn" style="color: #fff;"></i>
                </div>
                <div class="update-text">
                    <h4>Government News</h4>
                    <p><b>Pongal Bonus Announced!</b></p>
                    <p>Eligible ration card holders will receive an additional bonus of Rs.1000 for Pongal 2026.</p>
                    
                </div>
            </div>

            <!--Update 2-->
            <div class="update-card green-card">
                <div class="update-icon green-icon">
                    <i class="fa fa-store" style="color: #fff;"></i>
                </div>
                <div class="update-text">
                    <h4>Main Ration Shop is Open</h4>
                    <p>The shop is open today(10/1/2026) from 10:00 AM to 1:00 PM.</p>
                    <p><i class="fa fa-circle" style="color: rgb(90, 186, 90); font-size: 10px;" ></i> Shop Open</p>
                </div>
            </div>
        </section>
    </user-app-layout>

</body>
</html>
